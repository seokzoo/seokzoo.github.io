<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>PSAT 헌법 & 자료해석 계산 연습</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div class="app-layout">
      <header class="app-header">
        <div class="header-top">
          <h1 id="app-title">PSAT 학습 센터</h1>
          <button class="settings-btn" onclick="app.openSettings()" title="설정">⚙️</button>
        </div>

        <div class="subject-toggle">
          <button id="subj-constitution" class="subj-btn active" onclick="app.switchSubject('constitution')">
            🏛️ 헌법
          </button>
          <button id="subj-calc" class="subj-btn" onclick="app.switchSubject('calc')">
            📊 자료해석 (계산)
          </button>
        </div>

        <nav class="app-nav">
          <button id="nav-solve" class="nav-btn active" onclick="app.switchTab('solve')">
            문제풀이
          </button>
          <button id="nav-stats" class="nav-btn" onclick="app.switchTab('stats')">기록/오답</button>
        </nav>
      </header>

      <main id="main-content" class="app-content">
        <!-- Dynamic Content -->
      </main>
    </div>

    <!-- Templates -->
    <template id="view-home-constitution">
      <div class="home-container">
        <div class="card">
          <h2>기출 문제 풀이</h2>
          <div class="year-grid" id="year-buttons">
            <!-- Buttons generated by JS -->
          </div>
        </div>
        <div class="card">
          <h2>무작위 풀이</h2>
          <button class="action-btn" onclick="app.startRandomQuiz()">랜덤 25문제 시작</button>
        </div>
        <div class="card">
          <h2>오답 복습</h2>
          <p class="sub-text">최근 7일간 틀린 헌법 문제를 다시 풀어봅니다.</p>
          <button class="action-btn outline" onclick="app.startReviewQuiz()">오답 복습 시작</button>
        </div>
      </div>
    </template>

    <template id="view-home-calc">
      <div class="home-container">
        <div class="card">
          <h2>유형별 계산 연습</h2>
          <p class="sub-text">원하는 계산 유형을 선택하여 연습하세요.</p>
          <div class="type-grid">
            <button class="type-btn" onclick="app.startCalcTypeQuiz('division_comparison')">
              <span class="type-icon">➗</span>
              <span class="type-title">분수 대소 비교</span>
            </button>
            <button class="type-btn" onclick="app.startCalcTypeQuiz('fraction_ordering')">
              <span class="type-icon">🔢</span>
              <span class="type-title">분수 순서 정렬</span>
            </button>
            <button class="type-btn" onclick="app.startCalcTypeQuiz('multiplication_comparison')">
              <span class="type-icon">✖️</span>
              <span class="type-title">곱셈 대소 비교</span>
            </button>
            <button class="type-btn" onclick="app.startCalcTypeQuiz('growth_matrix_comparison')">
              <span class="type-icon">📈</span>
              <span class="type-title">증가율 비교</span>
            </button>
            <button class="type-btn full-width" onclick="app.startCalcTypeQuiz('all')">
              <span class="type-icon">🎲</span>
              <span class="type-title">전체 유형 혼합 풀이</span>
            </button>
          </div>
        </div>

        <div class="card">
          <h2>세트별 문제 풀이</h2>
          <p class="sub-text">나눗셈(div) / 곱셈(mul) 세트를 골라서 풀기 (각 50세트)</p>
          <div class="set-selector-group">
            <select id="calc-category-select" class="custom-select" onchange="app.updateSetOptions()">
              <option value="div">나눗셈 세트 (Set 1~50)</option>
              <option value="mul">곱셈 세트 (Set 1~50)</option>
            </select>
            <select id="calc-set-select" class="custom-select">
              <!-- Set options generated by JS -->
            </select>
            <button class="action-btn" style="margin-top: 0.75rem;" onclick="app.startCalcSetQuiz()">세트 시작</button>
          </div>
        </div>

        <div class="card">
          <h2>무작위 모의고사</h2>
          <p class="sub-text">전체 문제 중 20문제를 무작위로 추출하여 풀어봅니다.</p>
          <button class="action-btn" onclick="app.startRandomQuiz()">랜덤 20문제 시작</button>
        </div>

        <div class="card">
          <h2>오답 복습</h2>
          <p class="sub-text">최근 7일간 틀린 계산 문제를 다시 풀어봅니다.</p>
          <button class="action-btn outline" onclick="app.startReviewQuiz()">오답 복습 시작</button>
        </div>
      </div>
    </template>

    <template id="view-quiz">
      <div class="quiz-container">
        <div class="quiz-header">
          <div class="quiz-header-left">
            <span id="quiz-info">2024년 1번</span>
            <span id="quiz-timer" class="timer-badge">⏱️ <span id="timer-sec">--</span>초</span>
          </div>
          <button class="text-btn" onclick="app.quitQuiz()">종료</button>
        </div>
        <div class="progress-bar">
          <div id="progress-fill"></div>
          <div id="timer-progress-fill" class="timer-progress"></div>
        </div>

        <div id="question-area" class="question-card">
          <!-- Question Content -->
        </div>

        <div id="feedback-area" class="feedback hidden">
          <!-- Correct/Wrong message -->
        </div>

        <div class="quiz-controls">
          <button id="btn-prev" class="control-btn" onclick="app.prevQuestion()">이전</button>
          <button id="btn-next" class="control-btn primary" onclick="app.nextQuestion()">
            다음
          </button>
        </div>
      </div>
    </template>

    <template id="view-result">
      <div class="result-container">
        <div class="score-card">
          <h3>시험 결과</h3>
          <div class="score-display">
            <span id="result-score">80</span>
            <span class="score-unit">점</span>
          </div>
          <p id="result-date" class="result-date"></p>
        </div>

        <div class="result-list" id="result-list">
          <!-- Question list with O/X -->
        </div>

        <div class="result-actions">
          <button class="action-btn" onclick="app.goHome()">메인으로</button>
        </div>
      </div>
    </template>

    <template id="view-stats">
      <div class="stats-container">
        <div class="card">
          <h2>점수 추이</h2>
          <div class="chart-container" id="score-chart">
            <!-- Simple CSS Chart -->
          </div>
        </div>
        <div class="card">
          <h2>Top 10 랭킹</h2>
          <ul class="rank-list" id="rank-list">
            <!-- List items -->
          </ul>
        </div>
      </div>
    </template>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h3>퀴즈 설정</h3>
          <button class="close-btn" onclick="app.closeSettings()">✕</button>
        </div>
        <div class="modal-body">
          <div class="setting-item">
            <label for="time-limit-select" class="setting-label">
              <strong>문제당 제한 시간</strong>
              <span class="setting-desc">제한 시간이 지나면 자동으로 다음 문제로 이동합니다.</span>
            </label>
            <select id="time-limit-select" class="custom-select" onchange="app.handleTimeLimitChange(this.value)">
              <option value="0">제한 없음 (OFF)</option>
              <option value="5">5초</option>
              <option value="10">10초</option>
              <option value="15">15초</option>
              <option value="20">20초</option>
              <option value="30">30초</option>
              <option value="60">60초</option>
              <option value="custom">직접 입력 (초)...</option>
            </select>
            <div id="custom-time-group" class="custom-time-group hidden" style="margin-top: 0.5rem;">
              <input type="number" id="custom-time-input" class="custom-input" min="1" max="600" placeholder="초 단위 입력 (예: 45)" />
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button class="action-btn" onclick="app.saveSettings()">설정 저장</button>
        </div>
      </div>
    </div>

    <script src="data.js"></script>
    <script src="calc_data.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .register("sw.js")
          .then(() => console.log("Service Worker Registered"))
      }
    </script>
  </body>
</html>
