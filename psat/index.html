<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PSAT 헌법 기출</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <h1>PSAT 헌법</h1>
            <nav class="app-nav">
                <button id="nav-solve" class="nav-btn active" onclick="app.switchTab('solve')">문제풀이</button>
                <button id="nav-stats" class="nav-btn" onclick="app.switchTab('stats')">기록/오답</button>
            </nav>
        </header>

        <main id="main-content" class="app-content">
            <!-- Dynamic Content -->
        </main>
    </div>

    <!-- Templates -->
    <template id="view-home">
        <div class="home-container">
            <div class="card">
                <h2>기출 문제 풀이</h2>
                <div class="year-grid" id="year-buttons">
                    <!-- Buttons generated by JS -->
                </div>
            </div>
            <div class="card">
                <h2>무작위 풀이</h2>
                <button class="action-btn" onclick="app.startRandomQuiz()">랜덤 25문제 시작</button>
            </div>
            <div class="card">
                <h2>오답 복습</h2>
                <p class="sub-text">최근 7일간 틀린 문제를 다시 풀어봅니다.</p>
                <button class="action-btn outline" onclick="app.startReviewQuiz()">오답 복습 시작</button>
            </div>
        </div>
    </template>

    <template id="view-quiz">
        <div class="quiz-container">
            <div class="quiz-header">
                <span id="quiz-info">2024년 1번</span>
                <span id="quiz-timer"></span>
                <button class="text-btn" onclick="app.quitQuiz()">종료</button>
            </div>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            
            <div id="question-area" class="question-card">
                <!-- Question Content -->
            </div>

            <div id="feedback-area" class="feedback hidden">
                <!-- Correct/Wrong message -->
            </div>

            <div class="quiz-controls">
                <button id="btn-prev" class="control-btn" onclick="app.prevQuestion()">이전</button>
                <button id="btn-next" class="control-btn primary" onclick="app.nextQuestion()">다음</button>
            </div>
        </div>
    </template>

    <template id="view-result">
        <div class="result-container">
            <div class="score-card">
                <h3>시험 결과</h3>
                <div class="score-display">
                    <span id="result-score">80</span>
                    <span class="score-unit">점</span>
                </div>
                <p id="result-date" class="result-date"></p>
            </div>
            
            <div class="result-list" id="result-list">
                <!-- Question list with O/X -->
            </div>

            <div class="result-actions">
                <button class="action-btn" onclick="app.goHome()">메인으로</button>
            </div>
        </div>
    </template>

    <template id="view-stats">
        <div class="stats-container">
            <div class="card">
                <h2>점수 추이</h2>
                <div class="chart-container" id="score-chart">
                    <!-- Simple CSS Chart -->
                </div>
            </div>
            <div class="card">
                <h2>Top 10 랭킹</h2>
                <ul class="rank-list" id="rank-list">
                    <!-- List items -->
                </ul>
            </div>
        </div>
    </template>

    <script src="data.js"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'));
        }
    </script>
</body>
</html>
