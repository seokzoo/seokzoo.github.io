<footer class="site-footer h-card">
    <data class="u-url" href="{{ "/" | relative_url }}"></data>
    <div class="wrapper">
      <div class="footer-col-wrapper">
        <div class="footer-col">
          <ul class="contact-list">
            <li class="p-name">
              <table><tbody> 
                <tr style="border-style: hidden;">
                  {%- if site.author -%}
                  <td style="border-style: hidden;"><a class="black-link" href="{{ site.url }}/about.html">
                    {{ site.author | escape }} 
                  </a></td>
                  {%- endif -%}
                  <td style="border-style: hidden;"><a class="black-link" href="{{ site.url }}/categories">
                    category
                      </a></td>
                  <td style="border-style: hidden;"><a class="black-link" href="{{ site.url }}/gallery">
                    gallery
                      </a></td>
                </tr>
              </tbody></table>
            </li>
              {%- if site.email -%}
             <li><a class="u-email black-link" href="mailto:{{ site.email }}">{{ site.email }}</a></li>
              {%- endif -%}
          </ul>
        </div>
      </div>
    </div>
  </footer>
