title: blog # The title of the blog
author: about me
email: seokzoo_@kakao.com # your email shown in the footer
url: https://seokzoo.github.io/ # this is your site's root address.
description: > # this means to ignore newlines until "show_excerpts:"
  항상 건강하고 행복하세요
favicon: "./favicon.png" # set the favicon of the site
show_excerpts: true # set to true to show excerpts on the homepage

# Moving date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
moving:
  avatar_url: "./selfie.jpeg" # avatar in about page
  about_you: Hi, I'm seokju! # short description about you in about page
  date_format: "%b %d" # date format of posts in home page
  back_to: "Home" # In the post page, you have a back button above the title, you can custom the text by yourself.

  # generate social links in about page.
  social_links:
    # twitter:
    github: seokzoo
    # cv: resume.pdf
    # rss: RSS
    # dribbble:
    # facebook:
    # flickr:
    # instagram: s3okzoo
    # linkedin: 
    # pinterest:
    # youtube:
    # youtube_channel:
    # youtube_channel_name:
    # telegram:
    # googleplus:
    # microdotblog:
    # reddit:

    # Mastodon instances
    # mastodon:
    # - username:
    #   instance:
    # - username:
    #   instance:

jekyll-archives:
  enabled:
    - categories
  layout: default
  layouts:
    category: category-archive
  permalinks:
    category: '/categories/:name/'

# Build settings
remote_theme: huangyz0918/moving
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-archives
